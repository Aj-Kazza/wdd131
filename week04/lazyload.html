<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <header>
        <h1>Lazy Load Demonstration</h1>
    </header>

     <main>
        <picture>
            <img src="https://placehold.co/600x600" alt="Placeholder Image" loading="lazy" width="400" height="600">
        </picture>
        <picture>
            <img src="https://placehold.co/400x600" alt="Placeholder Image" loading="lazy" width="400" height="600">
        </picture>
        <picture>
            <img src="https://placehold.co/500x400" alt="Placeholder Image" loading="lazy" width="400" height="600">
        </picture>
        <picture>
            <img src="https://placehold.co/500x600" alt="Placeholder Image" loading="lazy" width="400" height="600">
        </picture>
        <picture>
            <img src="https://placehold.co/550x600" alt="Placeholder Image" loading="lazy" width="400" height="600">
        </picture>
        <picture>
            <img src="https://placehold.co/450x600" alt="Placeholder Image" loading="lazy" width="400" height="600">
        </picture>

     </main>

     <footer>

     </footer>



</body>
</html>
